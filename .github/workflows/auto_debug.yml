name: Auto Debug CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: ./ci-cd-llm-auto-debugging
        run: npm ci
      - name: Run tests
        working-directory: ./ci-cd-llm-auto-debugging
        run: npm test --silent
      - name: Run auto debug script (placeholder)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Execute auto_debug.py
        run: |
          python .github/scripts/auto_debug.py
      - name: Upload auto-debug report
        uses: actions/upload-artifact@v4
        with:
          name: auto_debug_report
          path: auto_debug_report.json
      # LLM steps removed: CI will only run tests and produce the auto-debug report.
