name: Auto Debug CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: ./ci-cd-llm-auto-debugging
        run: npm ci
      - name: Run tests
        working-directory: ./ci-cd-llm-auto-debugging
        run: npm test --silent
      - name: Run auto debug script (placeholder)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Execute auto_debug.py
        run: |
          python .github/scripts/auto_debug.py
      - name: Upload auto-debug report
        uses: actions/upload-artifact@v4
        with:
          name: auto_debug_report
          path: auto_debug_report.json
      - name: Upload LLM prompt (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm_prompt
          path: llm_prompt.txt
      - name: Send prompt to OpenAI (optional)
        if: ${{ env.OPENAI_API_KEY != '' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .github/scripts/requirements.txt
          python .github/scripts/send_prompt_to_llm.py
      - name: Upload LLM response (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm_response
          path: llm_response.txt
      - name: Post LLM suggestion as PR comment (optional)
        if: ${{ github.event_name == 'pull_request' && env.OPENAI_API_KEY != '' }}
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const sugPath = './llm_suggestion.json';
            const rawPath = './llm_response.txt';
            let commentBody = '### 🤖 Automated LLM Analysis\n\n---\n\n**Summary / Suggestions:**\n\n';
            if (fs.existsSync(sugPath)) {
              try {
                const sug = JSON.parse(fs.readFileSync(sugPath, 'utf8'));
                if (sug.summary) commentBody += sug.summary + '\n\n';
                if (sug.patch && sug.patch.trim()) {
                  commentBody += 'Suggested patch (unified diff):\n\n```diff\n' + sug.patch + '\n```\n\n';
                }
              } catch (e) {
                commentBody += '(Could not parse structured suggestion)\n\n';
                if (fs.existsSync(rawPath)) commentBody += '```\n' + fs.readFileSync(rawPath, 'utf8') + '\n```\n\n';
              }
            } else if (fs.existsSync(rawPath)) {
              commentBody += '```\n' + fs.readFileSync(rawPath, 'utf8') + '\n```\n\n';
            } else {
              core.info('No LLM suggestion or response found to post.');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: commentBody,
            });
